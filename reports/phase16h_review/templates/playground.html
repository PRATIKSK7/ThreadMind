{% extends "base.html" %}

{% block content %}
<div class="main-content" style="padding: 30px; max-width: 1000px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
        <div>
            <h1 style="color: var(--cyan); margin-bottom: 10px; font-weight: 300; font-size: 2rem;">AI PLAYGROUND</h1>
            <p style="color: var(--text-secondary);">Test ThreadMind's real intelligence pipeline</p>
        </div>
        <div style="display: flex; gap: 15px; font-size: 0.85rem; font-family: var(--font-mono);">
            <div style="display: flex; align-items: center; gap: 6px; color: var(--text-primary);"><i data-lucide="activity" style="width:14px;height:14px;color:var(--green);"></i> V2 Production</div>
            <div style="display: flex; align-items: center; gap: 6px; color: var(--text-primary);"><i data-lucide="cpu" style="width:14px;height:14px;color:var(--cyan);"></i> LLM: llama3.2</div>
            <div style="display: flex; align-items: center; gap: 6px; color: var(--text-primary);"><i data-lucide="database" style="width:14px;height:14px;color:var(--blue);"></i> FAISS: Loaded</div>
        </div>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px;">
        <form id="playgroundForm" onsubmit="event.preventDefault(); analyzeQuery();">
            <div style="margin-bottom: 20px;">
                <label style="display: block; color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 0.05em; margin-bottom: 10px;">CUSTOMER MESSAGE</label>
                <textarea name="query" rows="4" style="width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: white; font-family: var(--font-sans); resize: vertical; outline: none;" placeholder="Enter a customer support query..." required></textarea>
            </div>
            
            <div id="errorBox" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--pink); color: var(--pink); padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem;"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-secondary" style="background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;" onclick="document.querySelector('textarea').value='I was charged twice for my prime video subscription this month.';">Example 1</button>
                    <button type="button" class="btn-secondary" style="background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;" onclick="document.querySelector('textarea').value='I was charged twice for my order and need a refund.';">Example 2</button>
                </div>
                
                <button type="submit" id="analyzeBtn" class="btn-primary" style="background: var(--blue); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="play" style="width: 16px; height: 16px;"></i> ANALYZE QUERY
                </button>
            </div>
        </form>
    </div>

    <div id="loading" style="display: none; text-align: center; padding: 40px; color: var(--cyan);">
        <i data-lucide="loader" style="width: 32px; height: 32px; animation: spin 2s linear infinite;"></i>
        <div style="margin-top: 16px; font-family: var(--font-mono); font-size: 0.9rem;">RUNNING THREADMIND PIPELINE...</div>
    </div>

    <div id="resultsArea" style="display: none;">
        <div class="result-container" style="display: flex; flex-direction: column; gap: 20px;">
            <div style="display: flex; gap: 20px;">
                <div style="flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;">
                    <div style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.05em; margin-bottom: 12px;">CLASSIFICATION</div>
                    <div id="res-intent" style="font-size: 1.5rem; color: var(--blue); margin-bottom: 8px;"></div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden;">
                            <div id="res-conf-bar" style="height: 100%; width: 0%; background: var(--cyan);"></div>
                        </div>
                        <div id="res-conf-text" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--cyan);"></div>
                    </div>
                    <div id="res-latency" style="margin-top: 16px; font-size: 0.8rem; color: var(--text-secondary);"></div>
                </div>
                
                <div style="flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;">
                    <div style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.05em; margin-bottom: 12px;">AUTONOMOUS DECISION</div>
                    <div style="display: flex; align-items: center; gap: 10px; color: var(--green); font-size: 1.2rem; font-weight: 600; margin-bottom: 12px;">
                        <i id="res-decision-icon" data-lucide="check-circle"></i> <span id="res-decision-text"></span>
                    </div>
                    <div id="res-decision-reason" style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5;"></div>
                </div>
            </div>

            <div id="res-llm-container" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px;">
            </div>

            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px;">
                <div style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.05em; margin-bottom: 16px;">RETRIEVED EVIDENCE (TOP 3)</div>
                <div id="res-retrieval-container" style="display: flex; flex-direction: column; gap: 12px;">
                </div>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<script>
async function analyzeQuery() {
    const textarea = document.querySelector('textarea[name="query"]');
    const query = textarea.value.trim();
    const errorBox = document.getElementById('errorBox');
    const loading = document.getElementById('loading');
    const resultsArea = document.getElementById('resultsArea');
    const analyzeBtn = document.getElementById('analyzeBtn');

    if (!query) {
        errorBox.textContent = "Enter a customer query first.";
        errorBox.style.display = "block";
        return;
    }

    errorBox.style.display = "none";
    loading.style.display = "block";
    resultsArea.style.display = "none";
    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<i data-lucide="loader" style="width: 16px; height: 16px; animation: spin 2s linear infinite;"></i> ANALYZING...';
    lucide.createIcons();

    try {
        const response = await fetch("/api/playground/analyze", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ query })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Analysis failed");
        }

        renderResults(data);
        resultsArea.style.display = "block";

    } catch (error) {
        errorBox.innerHTML = `<strong>Error:</strong> ${error.message}`;
        errorBox.style.display = "block";
    } finally {
        loading.style.display = "none";
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '<i data-lucide="play" style="width: 16px; height: 16px;"></i> ANALYZE QUERY';
        lucide.createIcons();
    }
}

function renderResults(data) {
    document.getElementById('res-intent').textContent = data.intent;
    document.getElementById('res-conf-bar').style.width = data.confidence + "%";
    document.getElementById('res-conf-text').textContent = data.confidence + "%";
    document.getElementById('res-latency').textContent = "LATENCY: " + data.latency + "s";

    const decisionIcon = document.getElementById('res-decision-icon');
    const decisionText = document.getElementById('res-decision-text');
    const decisionReason = document.getElementById('res-decision-reason');
    
    if (data.escalate && !data.llm_error) {
        decisionIcon.setAttribute("data-lucide", "alert-triangle");
        decisionText.textContent = "ESCALATE TO HUMAN";
        decisionText.parentElement.style.color = "var(--orange)";
    } else if (data.llm_error) {
        decisionIcon.setAttribute("data-lucide", "x-circle");
        decisionText.textContent = "LLM UNAVAILABLE";
        decisionText.parentElement.style.color = "var(--text-secondary)";
    } else {
        decisionIcon.setAttribute("data-lucide", "check-circle");
        decisionText.textContent = "AUTO-HANDLE";
        decisionText.parentElement.style.color = "var(--green)";
    }
    decisionReason.textContent = data.escalation_reason;

    const llmContainer = document.getElementById('res-llm-container');
    if (data.llm_error) {
        llmContainer.innerHTML = `
            <div style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.05em; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">LLM STATUS</div>
            <div style="color: var(--text-primary); font-size: 1.1rem; margin-bottom: 12px; font-weight: 600;">Local LLM unavailable</div>
            <div style="color: var(--text-secondary); line-height: 1.6;">
                Classification and retrieval completed successfully.<br>
                Start Ollama and try again.
            </div>
        `;
    } else {
        llmContainer.innerHTML = `
            <div style="color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.05em; margin-bottom: 16px;">GENERATED RESPONSE</div>
            <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 20px; color: var(--text-primary); line-height: 1.6; font-size: 1.05rem;">
                ${data.response}
            </div>
        `;
    }

    const retContainer = document.getElementById('res-retrieval-container');
    retContainer.innerHTML = '';
    data.retrieval.forEach((doc, idx) => {
        retContainer.innerHTML += `
            <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <div style="color: var(--cyan); font-family: var(--font-mono); font-size: 0.85rem;">0${idx+1} ${doc.intent}</div>
                    <div style="color: var(--text-secondary); font-family: var(--font-mono); font-size: 0.85rem;">SIM: ${doc.score.toFixed(4)}</div>
                </div>
                <div style="color: var(--text-secondary); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${doc.text}
                </div>
            </div>
        `;
    });
    
    lucide.createIcons();
}
</script>
{% endblock %}
